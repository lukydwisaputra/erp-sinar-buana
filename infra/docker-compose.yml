# SBMJ ERP — reference stack (4 services). Mirrors docs/architecture.md §2.
#
# Local dev: `docker compose up -d postgres minio` boots the data plane today.
# The `app` and `worker` services are wired but commented until their
# Dockerfiles exist (no app code yet). On Coolify, deploy each as its own
# resource and put Cloudflare (Tunnel) in front of `app` only.

services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbmj_erp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in infra/.env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB:-sbmj_erp}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # roles + auth stub (first boot)
    ports:
      # Host port is configurable — this machine already has other local
      # Postgres installs squatting on 5432/5433, which silently intercepted
      # connections meant for this container (found 2026-07-03: `docker exec`
      # into the container worked since that's a separate network namespace,
      # but host->published-port connections were actually landing on a
      # different, unrelated Postgres). Default to 5434 to avoid that; still
      # dev only — on Coolify keep internal (no public port).
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sbmj_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in infra/.env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console (dev only)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # app:
  #   build: ../app            # Next.js (UI + API + auth)
  #   environment:
  #     DATABASE_URL: postgres://app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-sbmj_erp}
  #     S3_ENDPOINT: http://minio:9000
  #     S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  #     S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  #     RESEND_API_KEY: ${RESEND_API_KEY}
  #     SENTRY_DSN: ${SENTRY_DSN}
  #   depends_on: { postgres: { condition: service_healthy }, minio: { condition: service_healthy } }
  #   ports: ["3000:3000"]

  # worker:
  #   build: ../app            # same image, worker entrypoint (pg-boss consumer)
  #   command: ["node", "dist/worker.js"]
  #   environment:
  #     DATABASE_URL: postgres://app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-sbmj_erp}
  #     RESEND_API_KEY: ${RESEND_API_KEY}
  #   depends_on: { postgres: { condition: service_healthy } }

volumes:
  pg_data:
  minio_data:
