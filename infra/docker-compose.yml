# SBMJ ERP — reference stack (5 services). Mirrors docs/architecture.md §2.
#
# Local dev: `docker compose up -d postgres minio maildev` boots the data
# plane + a dev SMTP catcher — running `app`/`worker` via `npm run dev` /
# `npm run worker` on the host is usually faster to iterate on. `docker
# compose up -d` (no service list) boots the full stack including `app`/
# `worker` built from their Dockerfiles, closer to how Coolify would run it.
# On Coolify, deploy each as its own resource and put Cloudflare (Tunnel) in
# front of `app` only — `maildev` is dev-only, never deployed.

services:
  postgres:
    build:
      context: ..
      dockerfile: infra/postgres/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sbmj_erp}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in infra/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in infra/.env}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB:-sbmj_erp}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # roles + auth stub (first boot)
    ports:
      # Host port is configurable — this machine already has other local
      # Postgres installs squatting on 5432/5433, which silently intercepted
      # connections meant for this container (found 2026-07-03: `docker exec`
      # into the container worked since that's a separate network namespace,
      # but host->published-port connections were actually landing on a
      # different, unrelated Postgres). Default to 5434 to avoid that; still
      # dev only — on Coolify keep internal (no public port).
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sbmj_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in infra/.env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console (dev only)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the upload bucket + grants anonymous read on the
  # S3_KEY_PREFIX prefix (infra/scripts/minio-init.sh). Runs and exits on
  # every `up` — idempotent, so re-running on an already-provisioned bucket
  # is harmless.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in infra/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in infra/.env}
      S3_BUCKET: ${S3_BUCKET:-sbmj-erp}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-testing}
    volumes:
      - ./scripts/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]

  # Dev-only SMTP catcher — Pengiriman's "Akun Email/SMTP" points here in
  # local dev (host=localhost, port=1025, any username/password) so the full
  # pg-boss → nodemailer pipeline (scripts/worker.ts) can be exercised
  # end-to-end without real-world SMTP credentials. Web UI at :1080 shows
  # every caught email. Never deployed — production points at a real SMTP
  # account instead (see email_accounts, configured via Konfigurasi).
  maildev:
    image: maildev/maildev:latest
    ports:
      - "1080:1080" # web UI
      - "1025:1025" # SMTP endpoint

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-sbmj_erp}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in infra/.env}
      SENTRY_DSN: ${SENTRY_DSN}
      # Company-logo upload (src/lib/storage/s3.ts) — the one upload feature
      # wired so far. S3_ENDPOINT (internal, container-to-container) is how
      # the app's own SDK calls reach MinIO to PUT the file. S3_PUBLIC_URL
      # (MinIO's published host port) is what gets baked into
      # company_profile.logo_url — a browser or an emailed PDF fetches the
      # image directly, and can't resolve the `minio` compose hostname.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set in infra/.env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set in infra/.env}
      S3_BUCKET: ${S3_BUCKET:-sbmj-erp}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-testing}
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports:
      # Dev-only convenience — on Coolify, Cloudflare Tunnel targets this
      # service internally, no published host port needed.
      - "3000:3000"

  worker:
    build:
      context: ..
      dockerfile: infra/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-sbmj_erp}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in infra/.env}
      SENTRY_DSN: ${SENTRY_DSN}
      # PDF attachments: the worker headlessly renders src/app/print/** by
      # hitting the app service over the internal Docker network — see
      # .env.example. Must match the app's own INTERNAL_RENDER_SECRET.
      APP_URL: http://app:3000
      INTERNAL_RENDER_SECRET: ${INTERNAL_RENDER_SECRET:?set in infra/.env}
    depends_on:
      postgres: { condition: service_healthy }
      app: { condition: service_started }
    # SMTP credentials are app-managed data (email_accounts, admin-configured
    # via Konfigurasi), not container env — the worker reads them from Postgres.

volumes:
  pg_data:
  minio_data:
